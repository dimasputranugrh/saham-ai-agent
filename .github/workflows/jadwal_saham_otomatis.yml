name: Jadwal Otomatis Karyawan AI Saham (WIB)

on:
  # Bisa dijalankan manual kapan saja lewat tombol "Run workflow" di GitHub
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pilih laporan (dsu / scan / close)'
        required: true
        default: 'dsu'

  # Jadwal Otomatis Senin-Jumat (Konversi UTC ke WIB = UTC + 7 jam)
  schedule:
    # 08:15 WIB -> 01:15 UTC (DSU Pagi Sebelum Bursa Buka)
    - cron: '15 1 * * 1-5'
    # 09:15 WIB -> 02:15 UTC (Sinyal Pembukaan Sesi 1)
    - cron: '15 2 * * 1-5'
    # 10:15 WIB -> 03:15 UTC (Pantauan Sesi 1)
    - cron: '15 3 * * 1-5'
    # 11:30 WIB -> 04:30 UTC (Radar Berita 7 Sektor & Peluang Masa Depan Siang)
    - cron: '30 4 * * 1-5'
    # 13:45 WIB -> 06:45 UTC (Pembukaan Sesi 2 Siang)
    - cron: '45 6 * * 1-5'
    # 14:15 WIB -> 07:15 UTC (Radar Berita 7 Sektor & Peluang Masa Depan Sesi 2)
    - cron: '15 7 * * 1-5'
    # 15:15 WIB -> 08:15 UTC (Pantauan JJS / Sore)
    - cron: '15 8 * * 1-5'
    # 16:15 WIB -> 09:15 UTC (Evaluasi Penutupan Pasar & Self-Learning)
    - cron: '15 9 * * 1-5'

permissions:
  contents: write

jobs:
  jalankan-karyawan-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode Aplikasi & Database Memory
        uses: actions/checkout@v4

      - name: Siapkan Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Library Analisis Saham & AI
        run: pip install -r requirements.txt

      - name: Jalankan Analisis, Evaluasi Memori, & Kirim ke Telegram Bos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python cloud_runner.py "${{ github.event.inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "15 1 * * 1-5" ]; then
            python cloud_runner.py dsu
          elif [ "${{ github.event.schedule }}" = "30 4 * * 1-5" ] || [ "${{ github.event.schedule }}" = "15 7 * * 1-5" ]; then
            python cloud_runner.py news
          elif [ "${{ github.event.schedule }}" = "15 9 * * 1-5" ]; then
            python cloud_runner.py close
          else
            python cloud_runner.py scan
          fi

      - name: Simpan Pembaruan Database Memory (agent_memory.db) ke GitHub
        run: |
          sqlite3 data/agent_memory.db "PRAGMA wal_checkpoint(TRUNCATE);" || true
          git config user.name "Saham AI Agent Bot"
          git config user.email "bot@saham-ai-agent.local"
          git add data/agent_memory.db data/watchlist.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(memory): auto-update persistent agent_memory.db from cloud run"
            git push origin HEAD:main || true
          fi
